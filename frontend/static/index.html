<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0284c7;
    --accent-dark: #0369a1;
    --accent-light: #e0f2fe;
    --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --user-bubble: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: #ffffff;
    color: var(--text-primary);
    padding: 1rem 1.5rem;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.2px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    box-shadow: var(--shadow-sm);
  }

  header .badge {
    background: var(--accent-light);
    color: var(--accent-dark);
    font-size: 0.75rem;
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    font-weight: 600;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  /* Dialogue Message Layout */
  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }

  .msg.user .avatar {
    background: var(--accent-light);
    color: var(--accent-dark);
    border: 1px solid #bae6fd;
  }

  .msg.agent .avatar {
    background: var(--accent-gradient);
    color: #ffffff;
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    max-width: 100%;
  }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 0 0.2rem;
  }

  .msg.user .msg-meta {
    justify-content: flex-end;
  }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
  }

  .msg.agent .bubble {
    background: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border-top-right-radius: 4px;
  }

  /* Rich A2UI Cards */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
  }

  /* Prompts Bar */
  .prompts-row {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1.5rem 0.25rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompts-row::-webkit-scrollbar { display: none; }

  .prompt-chip {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: #ffffff;
    color: #334155;
    font-size: 0.825rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  .prompt-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
  }

  /* Follow-up Suggestion Chips */
  .followup-chips {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.4rem;
  }

  .followup-chip {
    padding: 0.35rem 0.75rem;
    border: 1px solid #bae6fd;
    border-radius: 16px;
    background: #f0f9ff;
    color: var(--accent-dark);
    font-size: 0.8rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .followup-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* Form & Input Bar */
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.5rem;
    background: #ffffff;
    border-top: 1px solid var(--border);
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: #f8fafc;
  }

  input:focus {
    background: #ffffff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }

  button {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  button:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; background: #ffffff; box-shadow: var(--shadow-md); max-width: 100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <span>✈️ Travel Concierge</span>
  <span class="badge">AI Agent</span>
</header>

<div id="log"></div>

<div id="prompts" class="prompts-row">
  <button type="button" class="prompt-chip" data-prompt="Find top attractions and weather forecast for Paris">🏖️ Paris Attractions & Weather</button>
  <button type="button" class="prompt-chip" data-prompt="Generate a photorealistic postcard of Kyoto in autumn">📸 Generate Kyoto Postcard</button>
  <button type="button" class="prompt-chip" data-prompt="Convert 500 EUR to USD and calculate trip budget for 3 people">💱 Budget & Currency Math</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask Travel Concierge something…" autocomplete="off" autofocus>
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "✈️");
  const contentWrapper = el("div", "msg-content");
  
  const meta = el("div", "msg-meta");
  const sender = el("span", "sender", who === "user" ? "You" : "Travel Concierge");
  const time = el("span", "time", new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  meta.appendChild(sender);
  meta.appendChild(time);
  
  const b = el("div", "bubble");
  contentWrapper.appendChild(meta);
  contentWrapper.appendChild(b);
  
  m.appendChild(avatar);
  m.appendChild(contentWrapper);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function addFollowupChips(msgContent, fullText) {
  if (!msgContent) return;
  const container = el("div", "followup-chips");
  
  let city = "";
  const match = String(fullText).match(/\b(Paris|Kyoto|Tokyo|Rome|Barcelona|London|New York|Bali|Hawaii|Sydney|Venice)\b/i);
  if (match) city = match[1];

  const chips = [
    { label: "🌤️ Check Weather", prompt: city ? `What is the weather forecast for ${city}?` : "What is the weather forecast?" },
    { label: "📸 Generate Postcard", prompt: city ? `Generate a scenic postcard image of ${city}` : "Generate a scenic travel postcard" },
    { label: "💱 Trip Budget Math", prompt: city ? `Calculate a 3-day travel budget for ${city}` : "Convert 500 EUR to USD and calculate trip budget" }
  ];

  chips.forEach(c => {
    const chip = el("button", "followup-chip", c.label);
    chip.type = "button";
    chip.addEventListener("click", () => {
      input.value = c.prompt;
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
    container.appendChild(chip);
  });

  msgContent.appendChild(container);
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";

  if (b.parentNode) {
    addFollowupChips(b.parentNode, textStr || flattenText(a2ui));
  }

  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".prompt-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    input.value = chip.dataset.prompt;
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  });
});
</script>
</body>
</html>
